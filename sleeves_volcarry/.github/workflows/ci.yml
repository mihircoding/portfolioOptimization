# Runs the math sanity checks on every push. If a change ever breaks
# put-call parity, a greek, or the Monte Carlo agreement, the push gets
# a red X on GitHub.
name: tests

on: [push, pull_request]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pandas
      - run: python test_sanity.py
